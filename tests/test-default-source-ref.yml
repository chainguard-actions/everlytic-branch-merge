name: Test default source_ref (uses github.ref)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # source_ref intentionally omitted — defaults to github.ref (refs/heads/act-harness)
          target_branch: main

      - name: Assert action ran using default source_ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will attempt to merge the default source_ref (act-harness) into main.
          # With the sentinel repo, the API call will fail gracefully.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: merge succeeded using default source_ref"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
