name: Test default source_ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # source_ref defaults to github.ref (refs/heads/act-harness under act)
          target_branch: main

      - name: Assert action ran using default source_ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action uses the default source_ref (github.ref = refs/heads/act-harness).
          # The GitHub merge API call will fail on the sentinel repo (not a real repo),
          # so we accept either success or graceful failure.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with default source_ref"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
